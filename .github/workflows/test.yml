name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >=24.9 nötig: Jest 30 nutzt Node's natives require(esm), um die
          # ESM-only NestJS-12-Pakete zu laden (siehe README, ADR-0002).
          node-version: 24
          cache: npm
      # Muss zur npm-Version passen, mit der package-lock.json erzeugt wurde
      # (README: npm ci scheitert sonst mit falschem "Missing: <pkg> from
      # lock file" über verschiedene npm-Majors hinweg trotz gültigem Lockfile).
      - run: npm install -g npm@11
      - run: npm ci
      # Frontend-Gerüst-Specs sind noch lückenhaft (siehe README/ADR-0002);
      # CI gatet vorerst nur auf dem vollständig grünen Backend-Testlauf.
      - run: npm test -w backend
