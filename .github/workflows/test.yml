name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Frontend-Gerüst-Specs sind noch lückenhaft (siehe README/ADR-0002);
      # CI gatet vorerst nur auf dem vollständig grünen Backend-Testlauf.
      - run: npm test -w backend
